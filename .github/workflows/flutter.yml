name: Flutter validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test mock_api tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
