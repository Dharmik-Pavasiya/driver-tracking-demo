name: driver_tracking_demo
description: A small Android and iOS GPS tracking assessment using GetX.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
  geolocator: ^14.1.2
  permission_handler: ^12.0.1
  connectivity_plus: ^7.0.0
  http: ^1.5.0
  path: ^1.9.1
  sqflite: ^2.4.2
  sqflite_common: ^2.5.6
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Tests use real SQLite without needing a phone.
  sqflite_common_ffi: ^2.4.0
flutter:
  uses-material-design: true
